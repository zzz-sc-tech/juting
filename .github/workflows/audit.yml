# 夜间语料审计：每天凌晨（北京时间 05:00）跑 seed 级门禁，数据漂移（误提交、
# 生成脚本回归）第二天自动报警（workflow 失败 → GitHub 邮件）。
#
# 只跑仓库可验的两道门（纯 node:fs 零依赖，node 24 原生跑无需安装任何包）：
#   - check-missing-questions.mjs   题组连续性/缺题（cet4+cet6 seed）
#   - check-monotonicity.mjs        时间轴单调/重叠/负时长（cet4+cet6 seed）
#
# 完整六道门禁（含连 MySQL 活库的不变式/时长健全、含 ffmpeg 啃音频的重叠门）
# 依赖数据库与媒体，只能在有运行环境的机器上跑：node scripts/audit/check-all.mjs。
# （CI 上这两类门会分别「连不上库崩溃」和「无媒体空转假绿」，故不放进本 workflow。）
name: audit

on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 北京 05:00
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: seed 门禁（缺题 + 单调/重叠/负时长）
        run: |
          node scripts/audit/check-missing-questions.mjs
          node scripts/audit/check-monotonicity.mjs
